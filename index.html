<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health BMI & Calorie Calculator</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="card">
<h1>Health BMI & Calorie Calculator</h1>
<input id="name" placeholder="Name">
<input id="age" type="number" placeholder="Age">
<select id="gender"><option>Male</option><option>Female</option></select>
<input id="weight" type="number" placeholder="Weight (kg)">
<input id="height" type="number" placeholder="Height (cm)">
<select id="activity">
<option value="1.2">Sedentary</option>
<option value="1.375">Lightly Active</option>
<option value="1.55" selected>Moderately Active</option>
<option value="1.725">Very Active</option>
<option value="1.9">Extra Active</option>
</select>
<button onclick="calculate()">Calculate</button>
<div id="out"></div>
</div>
<script src="script.js"></script>
</body></html>
